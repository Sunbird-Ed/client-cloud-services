name: PR Build

on:
  pull_request:

jobs:
  build-pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with: 
          node-version: '22.15'

      - name: Install dependencies
        run: yarn install

      - name: Check installed versions
        run: |
          node -v

      - name: Build project
        run: |
          npm run build